seed: 42
paths:
  data: data
  splits: splits
  outputs: outputs
  results: resultados
data:
  positive_classes:
  - mel
  image_size: 224
  sources:
    ham10000:
      metadata: data/ham10000/HAM10000_metadata.csv
      metadata_md5: 8f85fb1aa29d80a2797247e434deb79d
      images: data/ham10000/images
  cache: true
  augmentation:
    flip: true
    rotation: 0.5
    zoom: 0.2
    brightness: 0.1
    contrast: 0.1
  max_images: null
split:
  name: ham10000_v1
  group_column: lesion_id
  stratify_by:
  - dx
  - dataset
  test_fraction: 0.15
  n_folds: 5
model:
  backbone: mobilenet_v3_large
  weights: imagenet
  dropout: 0.2
training:
  batch_size: 32
  mixed_precision: true
  jit_compile: true
  phases:
    head:
      epochs: 5
      learning_rate: 0.001
    finetune:
      epochs: 20
      learning_rate: 1.0e-05
  early_stopping_patience: 5
  imbalance: none
  oversampling_positive_fraction: 0.5
  focal_gamma: 2.0
metrics:
  target_recall: 0.9
  target_auc: 0.9
  bootstrap_resamples: 2000
  confidence_level: 0.95
experiment: exp05
source_run: exp06/20261004T053842Z_dos-fotos
folds:
- 0
- 1
- 2
- 3
- 4
formats:
- float32
- float16
- dynamic_range
- int8
representative_samples: 200
benchmark:
  threads: 2
  images: 20
  warmup_runs: 10
  timed_runs: 200
  cold_start_runs: 5
satisficing:
  max_size_mb: 15
  max_p95_ms_single_case: 100
  max_p95_ms_concurrent_cases: 300
  concurrent_cases: 4
  max_p95_case_s: 1.5
  max_cold_start_s: 2.0
  max_auc_drop: 0.005
  max_sensitivity_drop_points: 1.0
