seed: 42
paths:
  data: data
  splits: splits
  outputs: outputs
  results: resultados
data:
  positive_classes:
  - mel
  image_size: 224
  sources:
    ham10000:
      metadata: data/ham10000/HAM10000_metadata.csv
      metadata_md5: 8f85fb1aa29d80a2797247e434deb79d
      images: data/ham10000/images
  cache: true
  augmentation:
    flip: true
    rotation: 0.5
    zoom: 0.2
    brightness: 0.1
    contrast: 0.1
  max_images: null
split:
  name: ham10000_v1
  group_column: lesion_id
  stratify_by:
  - dx
  - dataset
  test_fraction: 0.15
  n_folds: 5
model:
  backbone: mobilenet_v3_large
  weights: imagenet
  dropout: 0.2
training:
  batch_size: 32
  mixed_precision: true
  jit_compile: true
  phases:
    head:
      epochs: 5
      learning_rate: 0.001
    finetune:
      epochs: 20
      learning_rate: 1.0e-05
  early_stopping_patience: 5
  imbalance: none
  oversampling_positive_fraction: 0.5
  focal_gamma: 2.0
metrics:
  target_recall: 0.9
  target_auc: 0.9
  bootstrap_resamples: 2000
  confidence_level: 0.95
experiment: exp04
single_view_run: exp03/20261003T194439Z_none
two_view_run: exp06/20261004T053842Z_dos-fotos
tflite_run: exp05/20261004T064739Z_tflite-dos-fotos
final_run: exp04/20261004T170840Z_modelo-final
format: float16
calibration:
  methods:
  - platt
  - isotonic
  ece_bins: 15
threshold_confidence: 0.95
evaluate_test: false
preregistered_run: null
