      epochs: 20
      learning_rate: 1.0e-05
  early_stopping_patience: 5
  imbalance: class_weight
  oversampling_positive_fraction: 0.5
  focal_gamma: 2.0
metrics:
  target_recall: 0.9
  target_auc: 0.9
  bootstrap_resamples: 2000
  confidence_level: 0.95
experiment: exp03
strategies:
- none
- class_weight
- oversampling
- focal_loss
folds:
- 0
- 1
- 2
- 3
- 4
