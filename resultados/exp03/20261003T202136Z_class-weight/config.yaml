seed: 42
paths:
  data: data
  splits: splits
  outputs: outputs
  results: resultados
data:
  positive_classes:
  - mel
  image_size: 224
  sources:
    ham10000:
      metadata: data/ham10000/HAM10000_metadata.csv
      metadata_md5: 8f85fb1aa29d80a2797247e434deb79d
      images: data/ham10000/images
  cache: true
  augmentation:
    flip: true
    rotation: 0.5
    zoom: 0.2
    brightness: 0.1
    contrast: 0.1
  max_images: null
split:
  name: ham10000_v1
  group_column: lesion_id
  stratify_by:
  - dx
  - dataset
  test_fraction: 0.15
  n_folds: 5
model:
  backbone: mobilenet_v3_large
  weights: imagenet
  dropout: 0.2
training:
  batch_size: 32
  mixed_precision: true
  jit_compile: true
  phases:
    head:
      epochs: 5
      learning_rate: 0.001
