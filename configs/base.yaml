# Configuración común. Cada experimento la hereda con `extends: base.yaml` y solo cambia lo
# necesario. Las rutas son relativas a la raíz del repo.

seed: 42

paths:
  data: data            # datasets crudos (fuera de git)
  splits: splits        # particiones congeladas (en git)
  outputs: outputs      # modelos, checkpoints y predicciones (fuera de git)
  results: resultados   # config, entorno y métricas de cada corrida (en git)

data:
  # Clases de HAM10000 que cuentan como positivas (1); el resto es 0. Melanoma vs. todas las demás.
  positive_classes: [mel]
  image_size: 224
  sources:
    # HAM10000 de Harvard Dataverse (doi:10.7910/DVN/DBW86T). El md5 fija la versión de los
    # metadatos: si el archivo cambia, EXP-01 se detiene.
    ham10000:
      metadata: data/ham10000/HAM10000_metadata.csv
      metadata_md5: 8f85fb1aa29d80a2797247e434deb79d
      images: data/ham10000/images
  # La imagen completa se redimensiona a image_size × image_size, sin recortar, para no cortar
  # el borde de las lesiones grandes. El modelo recibe píxeles 0-255 (MobileNetV3 trae su propio
  # preprocesamiento), igual que el `.tflite` en el backend.
  cache: true          # guarda en RAM las imágenes ya redimensionadas (~1 GB con 224 px)
  # Aumento de datos, solo en entrenamiento. La dermatoscopía no tiene orientación canónica, así
  # que se usan giros completos; el color cambia poco porque es parte del diagnóstico.
  augmentation:
    flip: true          # horizontal y vertical
    rotation: 0.5       # fracción de vuelta: 0.5 = ±180°
    zoom: 0.2           # acercamiento aleatorio de hasta 20%
    brightness: 0.1
    contrast: 0.1
  max_images: null      # solo para pruebas rápidas: limita las imágenes de cada partición

split:
  name: ham10000_v1         # carpeta en splits/
  group_column: lesion_id   # todas las imágenes de una lesión caen en la misma partición
  # Estratos: clase × fuente dentro de HAM10000. La fuente importa porque vidir_molemax tiene
  # 3,954 imágenes y solo 24 melanomas: así cada fold recibe la misma mezcla.
  stratify_by: [dx, dataset]
  test_fraction: 0.15       # test fijo; se usa una sola vez, al final de EXP-04
  n_folds: 5                # StratifiedGroupKFold sobre el resto

model:
  backbone: mobilenet_v3_large   # sin comparación de arquitecturas (memoria v5)
  weights: imagenet
  dropout: 0.2                   # antes de la capa densa final (1 neurona, sigmoide)

training:
  batch_size: 32
  mixed_precision: true   # solo si hay GPU
  # El backbone se usa siempre en modo inferencia (training=False): sus BatchNorm no cambian sus
  # estadísticas aunque se descongele, como recomienda la guía de transfer learning de Keras.
  phases:
    head:        # fase 1: backbone congelado, solo se entrena la cabeza
      epochs: 5
      learning_rate: 1.0e-3
    finetune:    # fase 2: se descongela todo el backbone, con tasa de aprendizaje baja
      epochs: 20
      learning_rate: 1.0e-5
  # En la fase 2 se detiene si el AUC de validación no mejora en tantas épocas, y se queda con
  # la mejor época.
  early_stopping_patience: 5
  imbalance: none   # none | class_weight | oversampling | focal_loss (EXP-03)

metrics:
  target_recall: 0.90   # obligatorio en el umbral operativo
  target_auc: 0.90      # meta propuesta para comparar candidatos
  bootstrap_resamples: 2000
  confidence_level: 0.95
