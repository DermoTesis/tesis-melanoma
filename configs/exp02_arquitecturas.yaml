# EXP-02: {MobileNetV2, MobileNetV3-Large} × {cabeza densa, Random Forest} en los 5 folds.
# El RF se entrena sobre las features del mismo backbone ya ajustado: solo cambia el clasificador.
# Se compara por AUC-ROC (media ± desviación entre folds). Resuelve HU15/HU16 de la memoria v4.
extends: base.yaml
experiment: exp02

candidates:
  backbones: [mobilenet_v2, mobilenet_v3_large]
  heads: [dense, random_forest]
folds: [0, 1, 2, 3, 4]

training:
  imbalance: none   # el desbalance se estudia aparte en EXP-03

random_forest:
  n_estimators: 500
  max_features: sqrt
  min_samples_leaf: 1
